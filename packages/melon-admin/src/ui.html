<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台</title>
<style>
:root {
  --bg: #F7F9F9; --panel: #FFFFFF; --line: #E6EAEC; --soft: #EFF3F4; --text: #0F1419; --sub: #536471; --faint: #8B98A5;
  --accent: #1D9BF0; --ok: #00A36C; --warn: #D98E04; --bad: #E0245E; --bar: #DCEBFA;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E11; --panel: #15191E; --line: #2A3036; --soft: #1E2328; --text: #E7E9EA; --sub: #A1AAB3; --faint: #6E7781;
    --accent: #3AA8F2; --ok: #2FBF84; --warn: #E5A52A; --bad: #F4587E; --bar: #1F3448;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E11; --panel: #15191E; --line: #2A3036; --soft: #1E2328; --text: #E7E9EA; --sub: #A1AAB3; --faint: #6E7781;
  --accent: #3AA8F2; --ok: #2FBF84; --warn: #E5A52A; --bad: #F4587E; --bar: #1F3448;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
.hidden { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#login, #change { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
#login form, #change form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; }
#login h1, #change h1 { font-size: 20px; margin: 0 0 6px; }
#change .note { color: var(--sub); font-size: 13px; margin: -4px 0 4px; }

#app { display: flex; min-height: 100vh; }
nav { width: 200px; flex: none; background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden; }
nav .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; padding: 0 4px 12px 10px; white-space: nowrap; }
nav .brand span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { border: 0; background: none; color: var(--sub); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
.iconbtn:hover { background: var(--soft); color: var(--text); }
nav a[data-page] { display: flex; align-items: center; gap: 10px; color: var(--text); padding: 8px 10px; border-radius: 8px; margin-bottom: 2px; white-space: nowrap; }
nav a[data-page]:hover { background: var(--soft); }
nav a.on { background: var(--soft); font-weight: 600; }
nav .foot { margin-top: auto; padding: 0 6px 0 10px; color: var(--faint); font-size: 12px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
nav .foot .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
body.folded nav { width: 60px; }
body.folded nav .brand span, body.folded nav a .t, body.folded nav .foot .t { display: none; }
body.folded nav .brand { padding-left: 6px; }
body.folded nav a[data-page] { justify-content: center; padding: 9px 0; }
body.folded nav .foot { flex-direction: column; padding: 0; }
body.folded nav .fold svg { transform: rotate(180deg); }
main { flex: 1; min-width: 0; padding: 28px 28px 60px; max-width: 1200px; margin: 0 auto; }
h2 { font-size: 22px; margin: 0 0 18px; }
h3 { font-size: 15px; margin: 26px 0 10px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.pad { padding: 16px 18px; }
.grid { display: grid; gap: 12px; }
.stats { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.stat .k { color: var(--sub); font-size: 12px; }
.stat .v { font-size: 26px; font-weight: 700; margin: 4px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v.txt { font-size: 20px; line-height: 39px; }
.stat .s { color: var(--faint); font-size: 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.muted { color: var(--sub); } .faint { color: var(--faint); font-size: 12px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.chip { display: inline-block; font-size: 12px; border-radius: 999px; padding: 1px 9px; background: var(--soft); color: var(--sub); white-space: nowrap; }
.chip.custom { color: var(--accent); } .chip.unlimited { color: var(--ok); } .chip.off { color: var(--bad); }
input[type=text], input[type=password], input[type=number], input[type=search], select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none; }
input:focus, select:focus { border-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--bad); }
.err { color: var(--bad); font-size: 13px; min-height: 1em; }
.saved { color: var(--ok); font-size: 13px; }

.list > .item { padding: 12px 16px; border-top: 1px solid var(--line); }
.list > .item:first-child { border-top: 0; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--sub); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
tr.user { cursor: pointer; } tr.user:hover td { background: var(--soft); }
tr.detail td { background: var(--bg); cursor: default; }
.meter { min-width: 120px; }
.meter .n { font-size: 13px; white-space: nowrap; }
.track { height: 5px; border-radius: 999px; background: var(--soft); overflow: hidden; margin-top: 4px; }
.track > div { height: 100%; border-radius: 999px; background: var(--accent); }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; height: 100%; justify-content: flex-end; }
.bars .col { width: 100%; max-width: 38px; background: var(--bar); border-radius: 5px 5px 2px 2px; min-height: 2px; position: relative; }
.bars .col > i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); border-radius: inherit; }
.bars .d { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: visible; width: 0; display: flex; justify-content: center; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--sub); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.form { display: flex; flex-direction: column; gap: 14px; max-width: 520px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--sub); }
.amounts { display: flex; gap: 12px; flex-wrap: wrap; }
.amounts .field input { width: 140px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; color: var(--sub); }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.empty { padding: 28px; text-align: center; color: var(--faint); }

@media (max-width: 760px) {
  #app { flex-direction: column; }
  nav, body.folded nav { width: auto; height: auto; position: sticky; top: 0; z-index: 5; flex-direction: row; gap: 4px; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  nav .brand, nav .foot .t, nav .fold { display: none; }
  nav .foot { margin: 0 0 0 auto; padding: 0; }
  nav a[data-page], body.folded nav a[data-page] { margin: 0; padding: 8px 10px; }
  nav a svg { display: none; }
  body.folded nav a .t { display: inline; }
  main { padding: 16px 16px 60px; }
  .tablewrap { overflow-x: auto; }
}
</style>
</head>
<body>
<div id="login" class="hidden">
  <form id="loginForm" autocomplete="on">
    <h1 id="loginTitle">后台</h1>
    <input type="text" name="username" id="lu" placeholder="管理员用户名" autocomplete="username" required>
    <input type="password" name="password" id="lp" placeholder="密码" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" type="submit">登录</button>
  </form>
</div>

<div id="change" class="hidden">
  <form id="changeForm" autocomplete="off">
    <h1 id="changeTitle">设置新密码</h1>
    <div class="note" id="changeNote">这是第一次登录，先换掉初始密码。</div>
    <input type="password" id="co" placeholder="原密码" autocomplete="current-password">
    <input type="password" id="cn" placeholder="新密码（至少 8 位，字母加数字）" autocomplete="new-password" required>
    <input type="password" id="cc" placeholder="再输一次新密码" autocomplete="new-password" required>
    <div class="err" id="changeErr"></div>
    <button class="btn primary" type="submit" id="changeSubmit">保存并进入</button>
    <a id="changeCancel" class="hidden" style="text-align:center;font-size:13px">取消</a>
  </form>
</div>

<div id="app" class="hidden">
  <nav>
    <div class="brand"><span id="siteName">后台</span><button class="iconbtn fold" id="fold" title="收起"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button></div>
    <a data-page="overview"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span class="t">概览</span></a>
    <a data-page="users"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg><span class="t">用户</span></a>
    <a data-page="policy"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.2 1.1-2 2.5-2s2.5.8 2.5 2-1.1 1.8-2.5 2.2-2.5 1-2.5 2.3 1.1 2 2.5 2 2.5-.8 2.5-2"/></svg><span class="t">额度策略</span></a>
    <a data-page="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="t">设置</span></a>
    <div class="foot">
      <span class="t"><span id="meName"></span> · <a id="pw" class="hidden">改密码</a><span id="pwDot" class="hidden"> · </span><a id="logout">退出</a></span>
      <button class="iconbtn" id="theme" title="深浅色"></button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let META = null;
let PAGE = 'overview';
let OPEN = null; // 用户页展开的那一行

async function api(path, body) {
  const r = await fetch('api/' + path, body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ ok: false, error: { message: '服务器返回了 ' + r.status } }));
  if (r.status === 401 && path !== 'login') { showLogin(); throw new Error('请先登录'); }
  if (j.error?.code === 'must_change_password') { META.me = { ...META.me, mustChangePassword: true }; showChange(true); throw new Error(j.error.message); }
  if (!j.ok) throw new Error(j.error?.message || '出错了');
  return j;
}

const money = (n) => (META?.symbol || '¥') + (Number(n) || 0).toFixed(2);
const limitText = (n) => (META?.symbol || '¥') + (Number(n) || 0);
function ago(t) {
  if (!t) return '—';
  const s = (Date.now() - t) / 1000;
  if (s < 90) return '刚刚';
  if (s < 3600) return Math.round(s / 60) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
function hhmm(t) { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
const policyChip = (p) => p.mode === 'unlimited' ? '<span class="chip unlimited">不限</span>'
  : p.mode === 'custom' ? '<span class="chip custom">独立 ' + esc(Object.values(p.amounts || {}).map(limitText).join(' / ')) + '</span>'
  : '<span class="chip">通用</span>';

function meter(w) {
  if (w.limit === undefined) return '<div class="meter"><div class="n">' + money(w.used) + ' <span class="faint">不限</span></div></div>';
  const pct = w.limit > 0 ? Math.min(100, w.used / w.limit * 100) : 100;
  const color = w.used >= w.limit ? 'var(--bad)' : pct >= 80 ? 'var(--warn)' : 'var(--accent)';
  return '<div class="meter"><div class="n">' + money(w.used) + ' <span class="faint">/ ' + limitText(w.limit) + '</span></div><div class="track"><div style="width:' + pct + '%;background:' + color + '"></div></div></div>';
}

function bars(days) {
  const max = Math.max(...days.map((d) => d.total), 0.0001);
  // 天数多时隔几天标一个日期（最后一天总标），不然日期把图撑宽
  const step = days.length > 10 ? Math.ceil(days.length / 6) : 1;
  return '<div class="bars">' + days.map((d, i) =>
    '<div class="b" title="' + esc(d.day) + '：算额度 ' + money(d.counted) + ' · 全部 ' + money(d.total) + ' · ' + d.calls + ' 次">' +
    '<div class="col" style="height:' + Math.max(2, d.total / max * 100) + '%"><i style="height:' + (d.total ? d.counted / d.total * 100 : 0) + '%"></i></div>' +
    '<div class="d">' + ((days.length - 1 - i) % step === 0 ? esc(d.day.slice(5)) : '&nbsp;') + '</div></div>').join('') + '</div>' +
    '<div class="legend"><span><i style="background:var(--accent)"></i>算额度</span><span><i style="background:var(--bar)"></i>不算额度（自己的 key 等）</span></div>';
}

// ── 页面 ──
const PAGES = {
  async overview(main) {
    const { overview: o } = await api('overview');
    const sv = o.service;
    main.innerHTML = '<h2>概览</h2><div class="grid stats">' +
      stat('今日花费', money(o.today.counted), '算额度的 · 全部 ' + money(o.today.total)) +
      stat('今日调用', o.today.calls, '工具 ' + o.today.tools + ' · 失败 ' + o.today.failed) +
      stat('用户', o.users.active + ' / ' + o.users.total, '启用 / 全部') +
      stat('额度用完', o.users.exhausted, '人（任一时间窗）', o.users.exhausted ? 'warn' : '') +
      (sv ? stat('服务', esc(sv.text), esc(sv.detail || ''), 'txt ' + (sv.ok ? 'ok' : 'bad')) : '') +
      '</div><h3>近 7 天花费</h3><div class="panel pad">' + bars(o.days) + '</div>' +
      '<h3>今天用得最多</h3><div class="panel list">' +
      (o.top.length ? o.top.map((u) => '<div class="item row"><span class="grow">' + esc(u.name) + '</span>' + u.windows.map((w) => '<span class="faint">' + esc(w.label) + '</span>' + meter(w)).join('') + '</div>').join('')
        : '<div class="empty">今天还没有算额度的花费</div>') + '</div>';
  },

  async users(main) {
    const { users } = await api('users');
    const q = ($('#q')?.value || '').trim().toLowerCase();
    const shown = users.filter((u) => !q || (u.name + ' ' + (u.username || '')).toLowerCase().includes(q));
    const wins = META.windows;
    main.innerHTML = '<h2>用户</h2><div class="row" style="margin-bottom:12px"><input type="search" id="q" placeholder="搜索用户" value="' + esc(q) + '"><span class="faint grow">共 ' + users.length + ' 人 · 点一行改额度、看近 30 天</span>' +
      '</div>' +
      '<div class="panel tablewrap"><table><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>额度策略</th>' + wins.map((w) => '<th>' + esc(w.label) + '</th>').join('') + '<th>今日调用</th><th>最近活动</th></tr></thead><tbody>' +
      (shown.length ? shown.map((u) => userRow(u, wins)).join('') : '<tr><td colspan="' + (6 + wins.length) + '" class="empty">没有用户</td></tr>') + '</tbody></table></div>';
    const qi = $('#q');
    qi.oninput = () => { clearTimeout(qi._t); qi._t = setTimeout(() => render(), 250); };
    if (q) { qi.focus(); qi.setSelectionRange(q.length, q.length); }
    main.querySelectorAll('tr.user').forEach((tr) => tr.onclick = () => { OPEN = OPEN === tr.dataset.id ? null : tr.dataset.id; render(); });
    const open = shown.find((u) => u.id === OPEN);
    if (open) await userDetail(open, main);
  },

  async policy(main) {
    const [{ amounts }, { users }] = await Promise.all([api('policy'), api('users')]);
    const n = users.filter((u) => u.policy.mode === 'default').length;
    main.innerHTML = '<h2>额度策略</h2><div class="panel pad"><div class="form">' +
      '<div class="muted">通用策略：没有单独设置的用户都按它（现在 ' + n + ' 人）。改了立即生效。单独设置在「用户」里点某个人。</div>' +
      '<div class="amounts">' + META.windows.map((w) => '<div class="field"><label>' + esc(windowName(w)) + '（' + esc(META.symbol) + '）</label><input type="number" min="0" step="0.1" data-w="' + esc(w.id) + '" value="' + esc(amounts[w.id]) + '"></div>').join('') + '</div>' +
      '<div class="row"><button class="btn primary" id="savePolicy">保存</button><span id="policyMsg"></span></div></div></div>';
    $('#savePolicy').onclick = async () => {
      const next = {};
      main.querySelectorAll('input[data-w]').forEach((i) => next[i.dataset.w] = Number(i.value));
      try { await api('policy', { amounts: next }); $('#policyMsg').innerHTML = '<span class="saved">已保存</span>'; }
      catch (e) { $('#policyMsg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
    };
  },

  async settings(main) {
    const s = META.site;
    main.innerHTML = '<h2>设置</h2><div class="panel pad"><div class="form">' +
      '<div class="field"><label>网站名称（左上角、浏览器标签页）</label><input type="text" id="sn" maxlength="40" value="' + esc(s.siteName) + '"></div>' +
      '<div class="field"><label>默认深浅色（每个人还可以用左下角的按钮切换，只记在自己的浏览器里）</label><select id="st">' +
      [['system', '跟随系统'], ['light', '浅色'], ['dark', '深色']].map(([v, l]) => '<option value="' + v + '"' + (s.theme === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
      '<div class="row"><button class="btn primary" id="saveSite">保存</button><span id="siteMsg"></span></div></div></div>';
    $('#saveSite').onclick = async () => {
      try {
        const r = await api('settings', { siteName: $('#sn').value, theme: $('#st').value });
        META.site = r.site; applySite(); $('#siteMsg').innerHTML = '<span class="saved">已保存</span>';
      } catch (e) { $('#siteMsg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
    };
  },
};

const windowName = (w) => w.kind === 'day' ? '每天' : w.kind === 'week' ? '每周' : '每 ' + w.hours + ' 小时';
const stat = (k, v, s, cls = '') => '<div class="panel pad stat"><div class="k">' + esc(k) + '</div><div class="v ' + cls + '">' + v + '</div><div class="s">' + s + '</div></div>';

function userRow(u, wins) {
  const st = u.status === 'disabled' ? '<span class="chip off">已停用</span>' : '<span class="chip">启用</span>';
  const byId = Object.fromEntries(u.quota.windows.map((w) => [w.id, w]));
  return '<tr class="user" data-id="' + esc(u.id) + '"><td><div>' + esc(u.name) + '</div>' + (u.username && u.username !== u.name ? '<div class="faint">' + esc(u.username) + '</div>' : '') + '</td>' +
    '<td class="muted">' + esc(u.role || '—') + '</td><td>' + st + '</td><td>' + policyChip(u.policy) + '</td>' +
    wins.map((w) => '<td>' + (byId[w.id] ? meter(byId[w.id]) : '—') + '</td>').join('') +
    '<td>' + u.todayCalls + '</td><td class="muted">' + ago(u.lastActiveAt) + '</td></tr>' +
    (OPEN === u.id ? '<tr class="detail"><td colspan="' + (6 + wins.length) + '" id="detail"><div class="faint">读取中…</div></td></tr>' : '');
}

async function userDetail(u, main) {
  const cell = $('#detail', main);
  const { days } = await api('users/' + encodeURIComponent(u.id) + '/daily?days=30');
  let mode = u.policy.mode;
  const def = (await api('policy')).amounts;
  const draw = () => {
    cell.innerHTML = '<div class="grid" style="grid-template-columns:minmax(240px,1fr) minmax(0,2fr);gap:20px;padding:6px 2px">' +
      '<div class="form"><div class="field"><label>额度策略</label><div class="seg">' +
      [['default', '通用'], ['custom', '独立'], ['unlimited', '不限']].map(([v, l]) => '<button data-mode="' + v + '" class="' + (mode === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>' +
      (mode === 'custom' ? '<div class="amounts">' + META.windows.map((w) => '<div class="field"><label>' + esc(windowName(w)) + '（' + esc(META.symbol) + '）</label><input type="number" min="0" step="0.1" data-w="' + esc(w.id) + '" value="' + esc(u.policy.amounts?.[w.id] ?? def[w.id]) + '"></div>').join('') + '</div>'
        : mode === 'default' ? '<div class="faint">按通用策略：' + META.windows.map((w) => esc(windowName(w)) + ' ' + limitText(def[w.id])).join(' · ') + '</div>'
        : '<div class="faint">不限额度（花费照样记录）</div>') +
      '<div class="row"><button class="btn primary" id="saveQuota">保存额度</button>' +
      (META.canSetStatus ? '<button class="btn ' + (u.status === 'disabled' ? '' : 'danger') + '" id="toggleStatus">' + (u.status === 'disabled' ? '启用' : '停用') + '</button>' : '') +
      '<span id="quotaMsg"></span></div></div>' +
      '<div><div class="faint" style="margin-bottom:4px">近 30 天每天的花费</div>' + bars(days) + '</div></div>';
    cell.querySelectorAll('[data-mode]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); mode = b.dataset.mode; draw(); });
    $('#saveQuota', cell).onclick = async () => {
      const amounts = {};
      cell.querySelectorAll('input[data-w]').forEach((i) => amounts[i.dataset.w] = Number(i.value));
      try { await api('users/' + encodeURIComponent(u.id) + '/quota', { mode, amounts }); render(); }
      catch (e) { $('#quotaMsg', cell).innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
    };
    const tg = $('#toggleStatus', cell);
    if (tg) tg.onclick = async () => {
      if (u.status !== 'disabled' && !confirm('停用「' + u.name + '」？这个用户的所有设备会退出，数据保留。')) return;
      try { await api('users/' + encodeURIComponent(u.id) + '/status', { status: u.status === 'disabled' ? 'active' : 'disabled' }); render(); }
      catch (e) { $('#quotaMsg', cell).innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
    };
  };
  draw();
}

// ── 骨架 ──
async function render() {
  document.querySelectorAll('nav a[data-page]').forEach((a) => a.classList.toggle('on', a.dataset.page === PAGE));
  const main = $('#main');
  try { await PAGES[PAGE](main); }
  catch (e) { if (e.message !== '请先登录') main.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}

function go(page) {
  PAGE = PAGES[page] ? page : 'overview';
  if (location.hash.slice(1) !== PAGE) history.replaceState(null, '', '#' + PAGE);
  OPEN = null;
  render();
}

function applySite() {
  document.title = META.site.siteName;
  $('#siteName').textContent = META.site.siteName;
  $('#loginTitle').textContent = META.site.siteName;
  applyTheme();
}

// 深浅色：先看这个浏览器自己选的，没选过用站点默认（跟随系统 / 浅 / 深）
const THEMES = ['system', 'light', 'dark'];
const THEME_ICON = {
  system: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"/></svg>',
  light: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
};
const THEME_NAME = { system: '跟随系统', light: '浅色', dark: '深色' };
function myTheme() { try { return localStorage.getItem('melon-admin.theme'); } catch { return null; } }
function applyTheme() {
  const t = myTheme() || META?.site.theme || 'system';
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  $('#theme').innerHTML = THEME_ICON[t];
  $('#theme').title = '深浅色：' + THEME_NAME[t] + '（点一下切换）';
}
$('#theme').onclick = () => {
  const cur = myTheme() || META?.site.theme || 'system';
  const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
  try { localStorage.setItem('melon-admin.theme', next); } catch { /* 隐私模式 */ }
  applyTheme();
};
try { if (localStorage.getItem('melon-admin.folded') === '1') document.body.classList.add('folded'); } catch { /* 隐私模式 */ }
$('#fold').onclick = () => {
  const on = document.body.classList.toggle('folded');
  try { localStorage.setItem('melon-admin.folded', on ? '1' : '0'); } catch { /* 隐私模式 */ }
};

// 刚登录时输的密码（只在内存里）：第一次登录改密码时不用再输一遍原密码
let LOGIN_PW = '';

function showOnly(id) { ['login', 'change', 'app'].forEach((x) => $('#' + x).classList.toggle('hidden', x !== id)); }
function showLogin() { LOGIN_PW = ''; showOnly('login'); $('#lu').focus(); }

/** 改密码：第一次登录（必须改，改完进后台）或者自己点「改密码」（可以取消）。 */
function showChange(forced) {
  showOnly('change');
  $('#changeTitle').textContent = forced ? '设置新密码' : '改密码';
  $('#changeNote').classList.toggle('hidden', !forced);
  $('#co').classList.toggle('hidden', forced && !!LOGIN_PW);
  $('#changeCancel').classList.toggle('hidden', forced);
  $('#changeSubmit').textContent = forced ? '保存并进入' : '保存';
  ['co', 'cn', 'cc'].forEach((x) => { $('#' + x).value = ''; });
  $('#changeErr').textContent = '';
  (forced && LOGIN_PW ? $('#cn') : $('#co')).focus();
}

function showApp() {
  if (META.me?.mustChangePassword) { showChange(true); return; }
  showOnly('app');
  $('#meName').textContent = META.me?.name || '';
  $('#pw').classList.toggle('hidden', !META.canChangePassword);
  $('#pwDot').classList.toggle('hidden', !META.canChangePassword);
  go(location.hash.slice(1) || 'overview');
}

$('#changeForm').onsubmit = async (e) => {
  e.preventDefault();
  const forced = !!META.me?.mustChangePassword;
  const oldPassword = forced && LOGIN_PW ? LOGIN_PW : $('#co').value;
  const nw = $('#cn').value;
  if (!oldPassword) { $('#changeErr').textContent = '要填原密码'; return; }
  if (nw.length < 8 || !/[a-zA-Z]/.test(nw) || !/\d/.test(nw)) { $('#changeErr').textContent = '新密码至少 8 位，要有字母和数字'; return; }
  if (nw !== $('#cc').value) { $('#changeErr').textContent = '两次输的新密码不一样'; return; }
  try {
    await api('password', { oldPassword, newPassword: nw });
    LOGIN_PW = '';
    META.me = { ...META.me, mustChangePassword: false };
    showApp();
  } catch (err) { $('#changeErr').textContent = err.message; }
};
$('#changeCancel').onclick = () => showApp();
$('#pw').onclick = () => showChange(false);

$('#loginForm').onsubmit = async (e) => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  try {
    const r = await api('login', { username: $('#lu').value, password: $('#lp').value });
    LOGIN_PW = r.me.mustChangePassword ? $('#lp').value : '';
    $('#lp').value = '';
    META.me = r.me;
    showApp();
  } catch (err) { $('#loginErr').textContent = err.message; }
};
$('#logout').onclick = async () => { await api('logout', {}).catch(() => {}); META.me = null; showLogin(); };
document.querySelectorAll('nav a[data-page]').forEach((a) => a.onclick = () => go(a.dataset.page));
window.addEventListener('hashchange', () => { if (META?.me) go(location.hash.slice(1)); });

(async () => {
  try { META = await api('meta'); } catch (e) { document.body.textContent = e.message; return; }
  applySite();
  if (META.me) showApp(); else showLogin();
})();
</script>
</body>
</html>
