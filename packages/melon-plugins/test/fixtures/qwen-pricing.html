window.__ICE_PAGE_PROPS__={"docDetailData":{"storeData":{"siteOverride":{"website":"cn","language":"zh"},"alias":"/model-studio/model-pricing","nodeId":null,"data":{"lastModifiedTime":1790247364000,"keywords":"模型价格,模型调用价格,模型推理价格","docTitle":"模型调用价格","language":"zh","seoTitle":"阿里云百炼模型价格-大模型服务平台百炼(Model Studio)-阿里云帮助中心","title":"模型调用计费","content":"<div lang=\"zh\" class=\"icms-help-docs-content\">\n<div lang=\"zh\" class=\"icms-help-docs-content\"><p data-tag=\"shortdesc\" class=\"shortdesc\">模型调用默认 按量计费 ，涵盖各类模型的计费规则与价格。</p><div class=\"note note-note\"><div class=\"note-icon-wrapper\"></div><div class=\"note-content\"><p><strong>说明</strong>本文仅展示模型调用<strong>原价</strong>，请前往<a href=\"https://bailian.console.aliyun.com/cn-beijing/model/market\">百炼控制台</a>查看活动优惠。</p></div></div>\n<div class=\"note note-note\"><div class=\"note-icon-wrapper\"></div><div class=\"note-content\"><p><strong>说明</strong>部分模型支持<strong>上下文缓存</strong>（显式缓存、隐式缓存）。缓存命中的输入 Token 及创建显式缓存的 Token 采用与标准输入不同的计费单价（例如显式缓存创建按标准输入单价的 125% 计费、命中按 10% 计费），本文价格表中的输入单价<strong>不含</strong>缓存单价。缓存的计费规则、单价折扣及支持的模型请参见<a href=\"/zh/model-studio/context-cache\">上下文缓存</a>。</p></div></div>\n<h2 id=\"阶梯计费规则\">阶梯计费规则 <span id=\"d3be061317ozi\"></span></h2>\n<p>百炼部分模型实行阶梯计费。单价取决于单次请求的输入 Token 总量。该请求的所有 Token 均按对应阶梯的单价结算。</p>\n<p>计费区间中的 K 表示 1,000，M 表示 1,000,000。例如，128K 即 128,000 Token，256K 即 256,000 Token，1M 即 1,000,000 Token。</p>\n<p>例如，某模型设有两档计费区间：0 &lt; Token ≤ 32K 和 32K &lt; Token ≤ 128K。若输入 100K Token，因数值落在第二区间（32K &lt; 100K ≤ 128K），所有 Token 均按第二档单价结算。</p>\n<h2 id=\"文本生成-千问\">文本生成-千问 <span id=\"e90fd1458c2vm\"></span></h2>\n<h3 id=\"千问max\">千问<span class=\"help-letter-space\"></span>Max <span id=\"c3741fefddnzj\"></span></h3>\n<p>计费规则：按输入<span class=\"help-letter-space\"></span>Token<span class=\"help-letter-space\"></span>和输出<span class=\"help-letter-space\"></span>Token<span class=\"help-letter-space\"></span>计费。</p>\n<p>影响计费的因素：若模型支持<span class=\"help-letter-space\"></span><a href=\"/zh/model-studio/batch-interfaces-compatible-with-openai\">Batch<span class=\"help-letter-space\"></span>调用</a>，其输入和输出<span class=\"help-letter-space\"></span>Token<span class=\"help-letter-space\"></span>单价均按实时推理价格的<span class=\"help-letter-space\"></span>50%计费；若模型支持<a href=\"/zh/model-studio/context-cache\">上下文缓存</a>，仅输入<span class=\"help-letter-space\"></span>Token<span class=\"help-letter-space\"></span>享有折扣。两者不能同时生效。</p>\n<div class=\"note note-note\"><div class=\"note-icon-wrapper\"></div><div class=\"note-content\"><p><strong>说明</strong>以下模型仅在华北<span class=\"help-letter-space\"></span>2（北京）地域下有免费额度，其他地域均无免费额度。</p></div></div>\n<section data-tag=\"tabbed-content-box\" outputclass=\"tabbed-content-box\" id=\"sec-tabs\" class=\"tabbed-content-box section\"><section id=\"华北2-北京\" class=\"section\"><h4 id=\"华北2-北京-h4\">华北<span class=\"help-letter-space\"></span>2（北京）</h4><table style=\"display:table;table-layout:fixed;width:100%;overflow-wrap:anywhere\"><colgroup><col style=\"width:16.716777%\"><col style=\"width:16.716777%\"><col style=\"width:16.716777%\"><col style=\"width:16.716777%\"><col style=\"width:16.716777%\"><col style=\"width:16.416115%\"></colgroup><thead><tr><th style=\"vertical-align:top\"><strong>模型 ID（Model ID）</strong></th><th style=\"vertical-align:top\"><strong>模式</strong></th><th style=\"vertical-align:top\"><strong>单次请求的输入<span class=\"help-letter-space\"></span>Token<span class=\"help-letter-space\"></span>数</strong></th><th style=\"vertical-align:top\"><strong>输入单价（每百万<span class=\"help-letter-space\"></span>Token）</strong></th><th style=\"vertical-align:top\"><strong>输出单价（每百万<span class=\"help-letter-space\"></span>Token）</strong><blockquote>\n<strong>思维链+回答</strong>\n</blockquote></th><th style=\"vertical-align:top\"><p><strong>免费额度</strong><a href=\"/zh/model-studio/new-free-quota#977b13081ab56\">（注）</a></p><sup>有效期：自开通百炼/模型发布/申请通过之日起<span class=\"help-letter-space\"></span>90<span class=\"help-letter-space\"></span>天内（以较晚者为准）</sup></th></tr></thead><tbody><tr><td style=
